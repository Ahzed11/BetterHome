name: betterhome
description: BetterHome — shared-home chores, points, and checklists.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  betterhome_api:
    path: ../generated/betterhome_api
  http: ^1.5.0
  intl: any
  oidc: ^5.0.2
  oidc_default_store: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.4
  webdriver: ^3.2.0

flutter:
  generate: true
  uses-material-design: true
