openapi: 3.0.3
info:
  title: BetterHome Scoring API
  version: 0.4.0
  description: Phase 3 scoring-service (port 8083). Aggregate index remains openapi.yaml.
servers:
  - url: http://localhost:8083
paths:
  /v1/households/{householdId}/points/award:
    parameters:
      - $ref: "#/components/parameters/householdId"
    post:
      operationId: awardPoints
      tags: [ledger]
      responses:
        "201":
          description: Award appended to ledger
  /v1/households/{householdId}/points/reverse:
    parameters:
      - $ref: "#/components/parameters/householdId"
    post:
      operationId: reversePoints
      tags: [ledger]
      responses:
        "201":
          description: Reversion and negative ledger row created
  /v1/households/{householdId}/points/adjust:
    parameters:
      - $ref: "#/components/parameters/householdId"
    post:
      operationId: adjustPoints
      tags: [ledger]
      responses:
        "201":
          description: Manual adjustment appended
  /v1/households/{householdId}/scoreboard:
    parameters:
      - $ref: "#/components/parameters/householdId"
    get:
      operationId: getScoreboard
      tags: [scoreboard]
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, year, all]
            default: month
        - name: yearMonth
          in: query
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{2}$'
      responses:
        "200":
          description: Scoreboard with podium and effort shares
  /v1/households/{householdId}/scoreboard/winners:
    parameters:
      - $ref: "#/components/parameters/householdId"
    get:
      operationId: listWinners
      tags: [scoreboard]
      responses:
        "200":
          description: Hall of past monthly winners
  /v1/households/{householdId}/scoreboard/close-month:
    parameters:
      - $ref: "#/components/parameters/householdId"
    post:
      operationId: closeMonth
      tags: [scoreboard]
      responses:
        "200":
          description: Monthly recap persisted
  /v1/households/{householdId}/scoreboard/recaps/{yearMonth}/celebrate:
    parameters:
      - $ref: "#/components/parameters/householdId"
      - name: yearMonth
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
    post:
      operationId: celebrateRecap
      tags: [scoreboard]
      responses:
        "200":
          description: Confetti marked as seen for caller
components:
  parameters:
    householdId:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
