---
openapi: "3.1.0"
info:
  title: "BetterHome API"
  version: "1.0.0-SNAPSHOT"
tags:
- name: "households"
- name: "invitations"
- name: "items"
- name: "lists"
- name: "memberships"
- name: "notifications"
- name: "points"
- name: "preferences"
- name: "recurrence"
- name: "scoreboard"
- name: "tasks"
- name: "templates"
- name: "users"
paths:
  /v1/households:
    get:
      summary: "List the households the caller belongs to"
      operationId: "listMyHouseholds"
      tags:
      - "households"
      responses:
        "401":
          description: "Not authenticated"
        "403":
          description: "Not allowed to do this"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/HouseholdResponse"
      security:
      - bearerAuth: []
    post:
      summary: "Create a household; the caller becomes its first admin"
      operationId: "createHousehold"
      tags:
      - "households"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
        required: true
      responses:
        "401":
          description: "Not authenticated"
        "403":
          description: "Not allowed to do this"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
        "400":
          description: "Invalid input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
