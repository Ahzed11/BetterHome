          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemResponse"
        "400":
          description: "Invalid input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "The list is archived, its items cannot change"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
