      tags:
      - "households"
      parameters:
      - name: "householdId"
        in: "path"
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      responses:
        "401":
          description: "Not authenticated"
        "403":
          description: "Not allowed to do this"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
