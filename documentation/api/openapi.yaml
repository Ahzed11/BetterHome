      summary: "Add an item at the end of the list"
      operationId: "addItem"
      tags:
      - "items"
      parameters:
      - name: "householdId"
        in: "path"
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      - name: "listId"
        in: "path"
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitleRequest"
        required: true
      responses:
        "401":
          description: "Not authenticated"
        "403":
          description: "Not an active member of the household"
          content:
            application/json:
