          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdResponse"
      security:
      - bearerAuth: []
    delete:
