        in: "path"
        required: true
        schema:
          $ref: "#/components/schemas/UUID"
      - name: "includeArchived"
        in: "query"
        schema:
          type: "boolean"
          default: false
      responses:
        "401":
          description: "Not authenticated"
        "403":
          description: "Not allowed to do this"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: "Membership cannot be checked right now"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "200":
          description: "OK"
          content:
            application/json:
              schema:
