# The gates of `make check` (docs, backend, app) and the web end-to-end journeys (e2e), run as parallel jobs so the wait is the slowest
# one, not their sum (T-0070, ADR 0019). The `check` job at the end is the single result to require.
# Runs on GitHub-hosted runners. When the hosted minutes run out, set the repository variable CI_RUNNER
# to `fallback` to use the self-hosted runner (ADR 0024); delete it to switch back.
# Not yet here: image builds (T-0046) and the OWASP dependency audit (T-0038).
name: check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Testcontainers / Dev Services find the container socket themselves: Docker's on hosted runners,
  # Podman's through DOCKER_HOST set by the fallback runner's service.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  docs:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-docs

  # One backend job per directory under backend/services, so a new service is tested without editing this file.
  services:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: backend/services
      - id: list
        run: echo "list=$(ls backend/services | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  backend:
    needs: services
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tooling/versions.env stays the single source of truth for pinned versions.
      - name: Read pinned versions
        run: |
          set -euo pipefail
          . tooling/versions.env
          echo "JAVA_MAJOR=$JAVA_MAJOR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MAJOR }}
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      # Spotless, Checkstyle, tests and the coverage floor of this service and of common-domain.
      - run: make test-backend SERVICE=${{ matrix.service }}

  app:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned versions
        run: |
          set -euo pipefail
          . tooling/versions.env
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"
          echo "JAVA_MAJOR=$JAVA_MAJOR" >> "$GITHUB_ENV"

      # The Dart client generator is a Java program.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MAJOR }}

      # Third-party, justified in documentation/tasks.md (T-0018): installs the exact Flutter version and caches pub.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The app depends on the generated client (gitignored, ADR 0006): generate it before resolving.
      - name: Generate the Dart client
        run: make client

      # The Makefile assumes a prepared checkout; a fresh runner has no .dart_tool package config yet.
      - name: Resolve app dependencies from the lockfile
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - run: make test-app test-guard

  # The real app against the real stack (Podman Compose: Postgres, Keycloak, five services) in headless Chrome:
  # browser sign-in through Keycloak, then the repository journey. `make e2e` boots the stack itself.
  e2e:
    # The stack uses fixed ports, so on the fallback only the runner labelled `fallback-e2e` takes this job:
    # concurrent e2e jobs queue there instead of colliding (ADR 0024).
    runs-on: ${{ vars.CI_RUNNER && format('{0}-e2e', vars.CI_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 40
    env:
      # `make up` drives Podman; compose talks to its API socket (started below), not to Docker.
      DOCKER_HOST: unix:///tmp/podman.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned versions
        run: |
          set -euo pipefail
          . tooling/versions.env
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"
          echo "JAVA_MAJOR=$JAVA_MAJOR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MAJOR }}
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      # The slow parts of `make e2e` that need no Flutter run in the background while Flutter is set up:
      # the Podman API socket, the images the stack uses (read from the files that name them) and the jars.
      - name: Prepare the stack in the background
        run: |
          podman --version
          setsid nohup podman system service --time=0 unix:///tmp/podman.sock >/tmp/podman-service.log 2>&1 &
          images="$(grep -h '^\s*image:' deploy/podman-compose.yml | awk '{print $2}') \
            $(grep -oP 'FLYWAY_IMAGE:-\K[^}]+' deploy/migrate.sh) \
            $(grep -h '^FROM' backend/services/*/src/main/docker/Dockerfile.jvm | awk '{print $2}' | sort -u)"
          setsid nohup sh -c 'for i in '"$images"'; do podman pull -q "$i" & done; wait' >/tmp/pull.log 2>&1 &
          echo $! > /tmp/pull.pid
          (cd backend && setsid nohup ./mvnw -B -q -DskipTests package >/tmp/mvn.log 2>&1 & echo $! > /tmp/mvn.pid)

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Chrome for Testing and chromedriver (pinned, checksummed)
        run: bash tooling/install-chrome.sh

      # Flutter web draws with WebGL. A runner has no GPU and Chrome 155 no longer falls back to software
      # WebGL by itself (blank page); every launch of the browser (WebDriver script and flutter drive
      # both use CHROME_EXECUTABLE) must pass --enable-unsafe-swiftshader, which is fine for trusted test content.
      - name: Make Chrome use software WebGL
        run: |
          set -euo pipefail
          . tooling/dev-env.sh
          wrapper="$DEV_TOOLS_DIR/chrome/chrome-swiftshader"
          printf '#!/bin/sh\nexec "%s" --enable-unsafe-swiftshader "$@"\n' "$CHROME_EXECUTABLE" > "$wrapper"
          chmod +x "$wrapper"
          echo "CHROME_EXECUTABLE=$wrapper" >> "$GITHUB_ENV"

      - name: Generate the Dart client
        run: make client

      - name: Resolve app dependencies from the lockfile
        working-directory: app
        run: flutter pub get --enforce-lockfile

      # Everything started in the background above must have finished before the stack is built.
      - name: Wait for the background preparation
        run: |
          while kill -0 "$(cat /tmp/mvn.pid)" 2>/dev/null; do sleep 2; done
          while kill -0 "$(cat /tmp/pull.pid)" 2>/dev/null; do sleep 2; done
          cat /tmp/pull.log
          [ -S /tmp/podman.sock ]

      # The jars were built in the background above, so `make up` does not build them again.
      - run: make e2e
        env:
          SKIP_PACKAGE: "1"

      # `make e2e` leaves the stack up. A hosted VM is thrown away; a self-hosted runner is not, and the
      # next run would find the ports taken. pkill exits 1 when the service is already gone.
      - name: Tear down the stack
        if: ${{ always() }}
        run: |
          make down
          pkill -f 'podman system service --time=0 unix:///tmp/podman.sock' || true

  # The one result to require on master (T-0053). It fails when any job above failed or was skipped.
  check:
    if: ${{ always() }}
    needs: [docs, services, backend, app, e2e]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a job did not succeed"; exit 1; }
          done
