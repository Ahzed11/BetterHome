# The gates of `make check` (docs, backend, app), run as parallel jobs so the wait is the slowest
# one, not their sum (T-0070, ADR 0019). The `check` job at the end is the single result to require.
# Not yet here: image builds (T-0046) and the OWASP dependency audit (T-0038).
name: check

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Hosted runners have Docker, not Podman: Testcontainers / Dev Services use its socket.
  DOCKER_HOST: unix:///var/run/docker.sock
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-docs

  # One backend job per directory under backend/services, so a new service is tested without editing this file.
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: backend/services
      - id: list
        run: echo "list=$(ls backend/services | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  backend:
    needs: services
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # tooling/versions.env stays the single source of truth for pinned versions.
      - name: Read pinned versions
        run: |
          set -euo pipefail
          . tooling/versions.env
          echo "JAVA_MAJOR=$JAVA_MAJOR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MAJOR }}
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      # Spotless, Checkstyle, tests and the coverage floor of this service and of common-domain.
      - run: make test-backend SERVICE=${{ matrix.service }}

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned versions
        run: |
          set -euo pipefail
          . tooling/versions.env
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"
          echo "JAVA_MAJOR=$JAVA_MAJOR" >> "$GITHUB_ENV"

      # The Dart client generator is a Java program.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MAJOR }}

      # Third-party, justified in documentation/tasks.md (T-0018): installs the exact Flutter version and caches pub.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The app depends on the generated client (gitignored, ADR 0006): generate it before resolving.
      - name: Generate the Dart client
        run: make client

      # The Makefile assumes a prepared checkout; a fresh runner has no .dart_tool package config yet.
      - name: Resolve app dependencies from the lockfile
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - run: make test-app test-guard

  # The real app against the real stack (Podman Compose: Postgres, Keycloak, five services) in headless Chrome:
  # browser sign-in through Keycloak, then the repository journey. `make e2e` boots the stack itself.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # `make up` drives Podman; compose talks to its API socket (started below), not to Docker.
      DOCKER_HOST: unix:///tmp/podman.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned versions
        run: |
          set -euo pipefail
          . tooling/versions.env
          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> "$GITHUB_ENV"
          echo "JAVA_MAJOR=$JAVA_MAJOR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_MAJOR }}
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Start the Podman API socket
        run: |
          podman --version
          podman compose version || true
          podman system service --time=0 unix:///tmp/podman.sock &
          for _ in $(seq 1 30); do [ -S /tmp/podman.sock ] && break; sleep 1; done
          podman info --format '{{.Host.Security.Rootless}}'

      - name: Install Chrome for Testing and chromedriver (pinned, checksummed)
        run: bash tooling/install-chrome.sh

      # Flutter web draws with WebGL. A runner has no GPU and Chrome 155 no longer falls back to software
      # WebGL by itself (blank page); every launch of the browser (WebDriver script and flutter drive
      # both use CHROME_EXECUTABLE) must pass --enable-unsafe-swiftshader, which is fine for trusted test content.
      - name: Make Chrome use software WebGL
        run: |
          set -euo pipefail
          . tooling/dev-env.sh
          wrapper="$DEV_TOOLS_DIR/chrome/chrome-swiftshader"
          printf '#!/bin/sh\nexec "%s" --enable-unsafe-swiftshader "$@"\n' "$CHROME_EXECUTABLE" > "$wrapper"
          chmod +x "$wrapper"
          echo "CHROME_EXECUTABLE=$wrapper" >> "$GITHUB_ENV"

      - name: Generate the Dart client
        run: make client

      - name: Resolve app dependencies from the lockfile
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: TEMP full-path diagnosis
        run: |
          . tooling/dev-env.sh
          CORS_ORIGINS=http://localhost:8090 make up >/tmp/up.log 2>&1 || { tail -30 /tmp/up.log; exit 1; }
          make -s -C . client >/dev/null 2>&1 || true
          cd app && flutter pub get >/dev/null
          chromedriver --port=4444 --verbose --log-path=/tmp/cd.log >/dev/null 2>&1 &
          flutter run -d web-server --release --no-pub --web-port=8090 \
            --dart-define=API_BASE_URL=http://localhost:8081 --dart-define=TASKS_API_BASE_URL=http://localhost:8082 \
            --dart-define=SCORING_API_BASE_URL=http://localhost:8083 --dart-define=KEYCLOAK_ISSUER=http://localhost:8180/realms/betterhome >/tmp/server.log 2>&1 &
          for _ in $(seq 1 150); do curl -sf http://localhost:8090/main.dart.js -o /dev/null && break; sleep 2; done
          date -u +%T; uptime
          bash -c '. ../deploy/lib.sh; ensure_user alice demo alice@betterhome.local alice' >/dev/null 2>&1
          dart run test_driver/web_sign_in.dart http://localhost:8090 alice demo 2>&1 | tail -6 || true
          date -u +%T
          echo "--- devtools exceptions/console ---"
          grep -A12 -E "Runtime.consoleAPICalled|Runtime.exceptionThrown|Log.entryAdded" /tmp/cd.log | grep -E '"(text|description|value|url|level|type)"' | cut -c1-300 | head -40
          echo "--- server log ---"; tail -15 /tmp/server.log
          echo "--- sandbox/gpu lines ---"; grep -iE "gpu|webgl|swiftshader|crash" /tmp/cd.log | cut -c1-300 | head -10

  # The one result to require on master (T-0053). It fails when any job above failed or was skipped.
  check:
    if: ${{ always() }}
    needs: [docs, services, backend, app, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a job did not succeed"; exit 1; }
          done
