quarkus.application.name=notifications-service
quarkus.http.port=8085
# Tests bind a random port, so jobs sharing a host (a persistent CI runner) do not collide on 8081.
quarkus.http.test-port=0

# Datasource — URL is profile-scoped so %test can use Dev Services
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:betterhome}
quarkus.datasource.password=${DB_PASSWORD:betterhome}
%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/betterhome_notifications}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}

# Schema owned by Flyway; never DDL from Hibernate
quarkus.hibernate-orm.schema.management.strategy=none
quarkus.hibernate-orm.mapping.timezone.default-storage=normalize-utc
# The JSON payload column is a plain string map; REST-specific Jackson settings must not leak in
quarkus.hibernate-orm.mapping.format.global=ignore

# Migrations run via make migrate / init containers in production, not at API startup
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=classpath:db/migration
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true

# Keycloak OIDC (service account / bearer tokens)
%dev.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/betterhome}
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:betterhome-api}
quarkus.oidc.application-type=service
# Keycloak puts realm roles (member, admin, service) under realm_access.roles
quarkus.oidc.roles.role-claim-path=realm_access/roles
%test.quarkus.oidc.tenant-enabled=false

# households-service, asked for user ids and languages with this service's own account
quarkus.rest-client.households.url=${HOUSEHOLDS_SERVICE_URL:http://localhost:8081}
quarkus.oidc-client.client-id=${OIDC_SERVICE_CLIENT_ID:betterhome-notifications-service}
quarkus.oidc-client.credentials.secret=${OIDC_SERVICE_CLIENT_SECRET}
%dev.quarkus.oidc-client.credentials.secret=${OIDC_SERVICE_CLIENT_SECRET:local-dev-only-change-me}
%dev.quarkus.oidc-client.auth-server-url=${OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/betterhome}
%prod.quarkus.oidc-client.auth-server-url=${OIDC_AUTH_SERVER_URL}
%test.quarkus.oidc-client.auth-server-url=http://localhost:9/realms/test
%test.quarkus.oidc-client.discovery-enabled=false
%test.quarkus.oidc-client.token-path=/protocol/openid-connect/token
%test.quarkus.oidc-client.credentials.secret=test-secret

# Authorization: health and OpenAPI public; everything else authenticated
quarkus.http.auth.permission.public.paths=/q/health/*,/q/openapi,/q/swagger-ui/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Push goes through Gotify (ADR 0027). Without a URL nothing is pushed; the inbox still works.
# Each user registers the token of their own Gotify application, so there is no global token.
betterhome.gotify.url=${GOTIFY_URL:}

# Observability
quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
# OpenTelemetry: every request gets a trace id (it reaches the logs and, as `traceparent`, outgoing
# REST calls) but no span is recorded or exported by default. To ship spans over OTLP set
# OTEL_TRACES_SAMPLER=parentbased_always_on (or parentbased_traceidratio) and
# OTEL_EXPORTER_OTLP_ENDPOINT; the `tracing` profile of deploy/podman-compose.yml starts a collector.
quarkus.otel.traces.sampler=${OTEL_TRACES_SAMPLER:parentbased_always_off}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.smallrye-openapi.info-title=BetterHome notifications API
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
# The e2e-only clock endpoint of common-domain is not part of the contract
mp.openapi.scan.exclude.packages=com.betterhome.common.testclock

# JSON: a field without a value is left out, so the optional fields of the contract are never null
quarkus.jackson.serialization-inclusion=non-null
