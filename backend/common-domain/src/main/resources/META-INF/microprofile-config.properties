# OidcAuthVerifier reads the Keycloak subject (a UUID) from the principal name; without this,
# quarkus-oidc names the principal after preferred_username and every real token is refused.
quarkus.oidc.token.principal-claim=sub

# Every authenticated endpoint documents the same bearer-token scheme in the generated OpenAPI.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
