# Local stack: Postgres, Keycloak and the five Quarkus services (prod profile).
# Use `make up`: it builds the jars (the Dockerfile.jvm files copy target/quarkus-app),
# starts Postgres and Keycloak, runs the Flyway one-shot jobs, then starts the services.
name: betterhome

# Shared by the five services. Migrations never run at startup (the prod profile keeps
# quarkus.flyway.migrate-at-start=false); `make migrate` runs Flyway as one-shot containers.
x-service: &service
  depends_on:
    keycloak:
      condition: service_healthy

x-service-env: &service-env
  DB_USER: betterhome
  DB_PASSWORD: betterhome
  OIDC_AUTH_SERVER_URL: http://keycloak:8180/realms/betterhome
  # Browsers on the web e2e target call the services cross-origin (E2E_WEB_PORT, tooling/e2e.sh)
  QUARKUS_HTTP_CORS_ENABLED: "true"
  QUARKUS_HTTP_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}
  # Every request has a trace id, but no span is recorded or exported by default. To see them locally:
  #   OTEL_TRACES_SAMPLER=parentbased_always_on podman compose -f deploy/podman-compose.yml --profile tracing up -d
  # then open Jaeger on http://localhost:16686 (services ship OTLP/gRPC to jaeger:4317).
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_off}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: betterhome
      POSTGRES_PASSWORD: betterhome
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # :Z relabels for rootless Podman/SELinux so the entrypoint can read the script
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betterhome"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
      # One issuer for everyone: tokens fetched from the host (localhost:8180) and
      # services reaching Keycloak as keycloak:8180 must agree on `iss`. The frontend URL is
      # pinned and back-channel endpoints (jwks_uri, token) follow the request host.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Read by the realm import (${NAME:default} in realm-betterhome.json), so one override changes the
      # clients and the services together.
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
      API_CLIENT_SECRET: ${API_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/realm-betterhome.json:/opt/keycloak/data/import/realm-betterhome.json:ro,Z
    healthcheck:
      # The image has no curl; probe the management port (9000) with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  households-service:
    <<: *service
    build:
      context: ../backend/services/households-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      <<: *service-env
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/betterhome_households
      TASKS_SERVICE_URL: http://tasks-service:8082
      SCORING_SERVICE_URL: http://scoring-service:8083
      LISTS_SERVICE_URL: http://lists-service:8084
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8085
      KEYCLOAK_ADMIN_URL: http://keycloak:8180/admin/realms/betterhome
      OIDC_SERVICE_CLIENT_ID: betterhome-households-service
      # Local-dev placeholder, same value as the secret in realm-betterhome.json
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "8081:8081"

  tasks-service:
    <<: *service
    build:
      context: ../backend/services/tasks-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      <<: *service-env
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/betterhome_tasks
      HOUSEHOLDS_SERVICE_URL: http://households-service:8081
      SCORING_SERVICE_URL: http://scoring-service:8083
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8085
      OIDC_SERVICE_CLIENT_ID: betterhome-tasks-service
      # Local-dev placeholder, same value as the secret in realm-betterhome.json
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "8082:8082"

  scoring-service:
    <<: *service
    build:
      context: ../backend/services/scoring-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      <<: *service-env
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/betterhome_scoring
      HOUSEHOLDS_SERVICE_URL: http://households-service:8081
      OIDC_SERVICE_CLIENT_ID: betterhome-scoring-service
      # Local-dev placeholder, same value as the secret in realm-betterhome.json
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "8083:8083"

  lists-service:
    <<: *service
    build:
      context: ../backend/services/lists-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      <<: *service-env
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/betterhome_lists
      HOUSEHOLDS_SERVICE_URL: http://households-service:8081
      OIDC_SERVICE_CLIENT_ID: betterhome-lists-service
      # Local-dev placeholder, same value as the secret in realm-betterhome.json
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "8084:8084"

  notifications-service:
    <<: *service
    build:
      context: ../backend/services/notifications-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      <<: *service-env
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/betterhome_notifications
      HOUSEHOLDS_SERVICE_URL: http://households-service:8081
      OIDC_SERVICE_CLIENT_ID: betterhome-notifications-service
      # Empty means no push (ADR 0027). With the gotify profile: GOTIFY_URL=http://gotify:80
      GOTIFY_URL: ${GOTIFY_URL:-}
      # Local-dev placeholder, same value as the secret in realm-betterhome.json
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "8085:8085"

  # Optional local trace collector and viewer; only started with --profile tracing
  jaeger:
    profiles: ["tracing"]
    image: docker.io/jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"

  # Optional local push server; only started with --profile gotify (ADR 0027). Sign in on
  # http://localhost:8070 as admin / admin (local only), create an application, and register its token
  # with PUT /v1/push-target.
  gotify:
    profiles: ["gotify"]
    image: docker.io/gotify/server:2.6.1
    environment:
      GOTIFY_DEFAULTUSER_PASS: admin
    ports:
      - "8070:80"
    volumes:
      - gotify-data:/app/data

volumes:
  postgres-data:
  gotify-data:
