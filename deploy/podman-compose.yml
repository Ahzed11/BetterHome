# Local stack: Postgres, Keycloak and the five Quarkus services (prod profile).
# Use `make up`: it builds the jars (the Dockerfile.jvm files copy target/quarkus-app),
# starts Postgres and Keycloak, runs the Flyway one-shot jobs, then starts the services.
# The project name and every published host port come from tooling/stack-env.sh (the stack slot), so
# several stacks can run side by side; the defaults here are slot 0. Container ports stay fixed.
name: ${COMPOSE_PROJECT_NAME:-betterhome}

# Shared by the five services. Migrations never run at startup (the prod profile keeps
# quarkus.flyway.migrate-at-start=false); `make migrate` runs Flyway as one-shot containers.
x-service: &service
  depends_on:
    keycloak:
      condition: service_healthy

x-service-env: &service-env
  DB_USER: betterhome
  DB_PASSWORD: betterhome
  OIDC_AUTH_SERVER_URL: http://keycloak:${KEYCLOAK_PORT:-8180}/realms/betterhome
  # Browsers on the web e2e target call the services cross-origin (E2E_WEB_PORT, tooling/e2e.sh)
  QUARKUS_HTTP_CORS_ENABLED: "true"
  QUARKUS_HTTP_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: betterhome
      POSTGRES_PASSWORD: betterhome
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # :Z relabels for rootless Podman/SELinux so the entrypoint can read the script
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betterhome"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: ${KEYCLOAK_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
      # One issuer for everyone: tokens fetched from the host (localhost:<port>) and
      # services reaching Keycloak as keycloak:<port> must agree on `iss`. The frontend URL is
      # pinned and back-channel endpoints (jwks_uri, token) follow the request host.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:${KEYCLOAK_PORT:-8180}"
    volumes:
      - ${REALM_FILE:-./keycloak/realm-betterhome.json}:/opt/keycloak/data/import/realm-betterhome.json:ro,Z
    healthcheck:
      # The image has no curl; probe the management port (9000) with bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  households-service:
    <<: *service
    build:
      context: ../backend/services/households-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      <<: *service-env
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/betterhome_households
      TASKS_SERVICE_URL: http://tasks-service:8082
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8085
      OIDC_SERVICE_CLIENT_ID: betterhome-households-service
      # Local-dev placeholder, same value as the secret in realm-betterhome.json
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "${HOUSEHOLDS_PORT:-8081}:8081"

  tasks-service:
    <<: *service
    build:
      context: ../backend/services/tasks-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      <<: *service-env
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/betterhome_tasks
      HOUSEHOLDS_SERVICE_URL: http://households-service:8081
      SCORING_SERVICE_URL: http://scoring-service:8083
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8085
      OIDC_SERVICE_CLIENT_ID: betterhome-tasks-service
      # Local-dev placeholder, same value as the secret in realm-betterhome.json
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "${TASKS_PORT:-8082}:8082"

  scoring-service:
    <<: *service
    build:
      context: ../backend/services/scoring-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      <<: *service-env
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/betterhome_scoring
      HOUSEHOLDS_SERVICE_URL: http://households-service:8081
      OIDC_SERVICE_CLIENT_ID: betterhome-scoring-service
      # Local-dev placeholder, same value as the secret in realm-betterhome.json
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "${SCORING_PORT:-8083}:8083"

  lists-service:
    <<: *service
    build:
      context: ../backend/services/lists-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      <<: *service-env
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/betterhome_lists
      HOUSEHOLDS_SERVICE_URL: http://households-service:8081
      OIDC_SERVICE_CLIENT_ID: betterhome-lists-service
      # Local-dev placeholder, same value as the secret in realm-betterhome.json
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "${LISTS_PORT:-8084}:8084"

  notifications-service:
    <<: *service
    build:
      context: ../backend/services/notifications-service
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      <<: *service-env
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/betterhome_notifications
      HOUSEHOLDS_SERVICE_URL: http://households-service:8081
      OIDC_SERVICE_CLIENT_ID: betterhome-notifications-service
      # Local-dev placeholder, same value as the secret in realm-betterhome.json
      OIDC_SERVICE_CLIENT_SECRET: ${OIDC_SERVICE_CLIENT_SECRET:-local-dev-only-change-me}
    ports:
      - "${NOTIFICATIONS_PORT:-8085}:8085"

volumes:
  postgres-data:
