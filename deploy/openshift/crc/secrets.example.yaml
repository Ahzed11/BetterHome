# TEMPLATE ONLY. It is deliberately not listed in kustomization.yaml and must never be applied as is.
# Create the real Secrets without committing them, for example:
#   oc create secret generic betterhome-db -n betterhome \
#     --from-literal=DB_USER=... --from-literal=DB_PASSWORD=...
#   oc create secret generic betterhome-oidc -n betterhome \
#     --from-literal=households-service-client-secret=... (one key per service, as below)
# Until they exist the pods stay in CreateContainerConfigError, which is intended.
apiVersion: v1
kind: Secret
metadata:
  name: betterhome-db
type: Opaque
stringData:
  DB_USER: REPLACE_ME
  DB_PASSWORD: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: betterhome-oidc
type: Opaque
stringData:
  # Client secrets of the Keycloak service-account clients betterhome-<service>-service
  households-service-client-secret: REPLACE_ME
  tasks-service-client-secret: REPLACE_ME
  scoring-service-client-secret: REPLACE_ME
  lists-service-client-secret: REPLACE_ME
  notifications-service-client-secret: REPLACE_ME
